[project]
name = "practica-nm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "davidgondur@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "altair>=6.3.0",
    "datasets>=5.2.0",
    "marimo>=0.25.2",
    "polars>=2.1.0",
    "wordcloud>=1.9.6",
]

[project.scripts]
practica-nm = "practica_nm:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.marimo.runtime]
dotenv = [".env"]

[tool.uv]
override-dependencies = ["numpy>=2"]
